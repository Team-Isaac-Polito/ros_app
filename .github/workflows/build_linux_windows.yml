name: Build Flutter Linux App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build for Linux (release)
        run: flutter build linux --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-build
          path: build/linux/x64/release/bundle/
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release (${{ matrix.arch }})
        run: flutter build windows --release --arch=${{ matrix.arch }}

      - name: Upload Windows artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: flutter-windows-${{ matrix.arch }}-build
          path: build/windows/${{ matrix.arch }}/runner/Release/
